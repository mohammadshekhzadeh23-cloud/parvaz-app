name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform & build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Restore signing keystore from secrets
        if: env.HAS_SIGNING == 'true'
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/parvaz-release.jks
          cat > keystore.properties << PROPS
          storeFile=../keystore/parvaz-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      # Run Gradle directly (instead of via an action) so we can capture full
      # output to a file and, on failure, surface the real compiler errors as
      # a workflow annotation -- readable via the GitHub API without anyone
      # needing to click into the raw log by hand.
      - name: Build debug APKs (modern + legacy)
        id: build_debug
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleModernDebug assembleLegacyDebug --no-daemon 2>&1 | tee build_debug.log

      - name: Report debug build errors
        if: steps.build_debug.outcome == 'failure'
        run: |
          {
            echo "### Gradle debug build failed -- extracted errors"
            echo '```'
            grep -E "^e: |error:|FAILURE|Exception|What went wrong|Unresolved reference|Caused by|\* Where:|\* What went wrong" build_debug.log | tail -100 || tail -150 build_debug.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ERR=$(grep -E "^e: |error:|FAILURE|Unresolved reference|What went wrong|Caused by" build_debug.log | tail -40 | tr '\n' '~')
          ERR="${ERR//~/%0A}"
          ERR="${ERR:0:60000}"
          echo "::error::${ERR}"

      - name: Upload raw debug build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build_debug.log

      - name: Fail job if debug build failed
        if: steps.build_debug.outcome == 'failure'
        run: exit 1

      - name: Upload modern debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parvaz-modern-debug-apk
          path: app/build/outputs/apk/modern/debug/app-modern-debug.apk

      - name: Upload legacy debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parvaz-legacy-debug-apk
          path: app/build/outputs/apk/legacy/debug/app-legacy-debug.apk

      - name: Build signed release APKs (modern + legacy)
        if: env.HAS_SIGNING == 'true'
        id: build_release
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleModernRelease assembleLegacyRelease --no-daemon 2>&1 | tee build_release.log

      - name: Report release build errors
        if: env.HAS_SIGNING == 'true' && steps.build_release.outcome == 'failure'
        run: |
          {
            echo "### Gradle release build failed -- extracted errors"
            echo '```'
            grep -E "^e: |error:|FAILURE|Exception|What went wrong|Unresolved reference|Caused by" build_release.log | tail -100 || tail -150 build_release.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ERR=$(grep -E "^e: |error:|FAILURE|Unresolved reference|What went wrong|Caused by" build_release.log | tail -40 | tr '\n' '~')
          ERR="${ERR//~/%0A}"
          ERR="${ERR:0:60000}"
          echo "::error::${ERR}"

      - name: Fail job if release build failed
        if: env.HAS_SIGNING == 'true' && steps.build_release.outcome == 'failure'
        run: exit 1

      - name: Upload modern release APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parvaz-modern-release-apk
          path: app/build/outputs/apk/modern/release/app-modern-release.apk

      - name: Upload legacy release APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parvaz-legacy-release-apk
          path: app/build/outputs/apk/legacy/release/app-legacy-release.apk
