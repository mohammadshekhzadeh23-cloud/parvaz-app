name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform & build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # These secrets are optional. Without them, only debug APKs are built below.
      # To enable signed release builds, add these under repo Settings -> Secrets ->
      # Actions: KEYSTORE_BASE64 (base64 of your .jks file), KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD. See README "Release signing" for how to get these
      # from your local keystore.properties / keystore/parvaz-release.jks.
      - name: Restore signing keystore from secrets
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/parvaz-release.jks
          cat > keystore.properties << PROPS
          storeFile=../keystore/parvaz-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Build debug APKs (modern + legacy)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: assembleModernDebug assembleLegacyDebug --no-daemon

      - name: Upload modern debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parvaz-modern-debug-apk
          path: app/build/outputs/apk/modern/debug/app-modern-debug.apk

      - name: Upload legacy debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parvaz-legacy-debug-apk
          path: app/build/outputs/apk/legacy/debug/app-legacy-debug.apk

      - name: Build signed release APKs (modern + legacy)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: assembleModernRelease assembleLegacyRelease --no-daemon

      - name: Upload modern release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: parvaz-modern-release-apk
          path: app/build/outputs/apk/modern/release/app-modern-release.apk

      - name: Upload legacy release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: parvaz-legacy-release-apk
          path: app/build/outputs/apk/legacy/release/app-legacy-release.apk
